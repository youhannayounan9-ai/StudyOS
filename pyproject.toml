[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studyos"
version = "0.1.0"
description = "Local-first personalized learning operating system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
